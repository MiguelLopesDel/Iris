<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Iris</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">IRIS</p>
    <h1>Sua biblioteca, em um só lugar.</h1>
    <p>Entre para acessar sua biblioteca privada.</p>
    <form id="login-form" class="login-form">
      <label>Usuário <input name="username" autocomplete="username" required autofocus></label>
      <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
