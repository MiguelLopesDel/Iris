<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Iris</title>
  <link rel="stylesheet" href="/static/style.css?v=71">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark login-brand-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="27.0"/><path d="M32.00 22.50L58.38 37.73"/><path d="M40.23 27.25L40.23 57.72"/><path d="M40.23 36.75L13.84 51.98"/><path d="M32.00 41.50L5.62 26.27"/><path d="M23.77 36.75L23.77 6.28"/><path d="M23.77 27.25L50.16 12.02"/></g><circle cx="35.2" cy="28.8" r="3.1" fill="currentColor"/></svg></div>
    <p class="eyebrow">IRIS</p>
    <h1>Sua biblioteca, em um só lugar.</h1>
    <p>Entre para acessar sua biblioteca privada.</p>
    <form id="login-form" class="login-form">
      <label>Usuário <input name="username" autocomplete="username" required autofocus></label>
      <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
