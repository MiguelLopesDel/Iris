name: Android checks

on:
  # As in ci.yml: pull requests are checked by their pull_request run only.
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fast Android tests
        run: ./scripts/test.sh fast
      - name: Compile app and instrumentation tests
        run: ./gradlew assembleDebug assembleLab assembleLabAndroidTest
      - name: Lint
        run: ./gradlew lintDebug
