name: Iris CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt ruff pip-audit
      - name: Compile
        run: python -m compileall -q core routers scripts tests server.py
      - name: Lint
        run: python -m ruff check core routers scripts tests server.py
      - name: Test
        run: python -m pytest -q
      - name: Audit dependencies
        # PYSEC-2022-252 (deep-translator) não tem correção publicada: 1.11.4 já
        # é a última versão. A dependência sai quando a busca migrar para um
        # modelo multilíngue e a tradução deixar de ser necessária; até lá,
        # ignorar este id mantém o passo capaz de acusar qualquer coisa NOVA,
        # que é o valor dele. Uma CI cronicamente vermelha não é auditoria.
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2022-252

  release-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot a clean private server
        run: ./scripts/test_release.sh
