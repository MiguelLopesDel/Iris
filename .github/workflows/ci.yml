name: Iris CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # The lock pins the whole graph with hashes; --no-deps keeps pip from
        # adding the packages it deliberately omits (see scripts/lock_deps.sh).
        run: pip install --no-deps --require-hashes -r requirements-dev.txt
      - name: Check installed dependency stack
        run: |
          python scripts/check_deps.py
          python -m pytest -q tests/test_dependency_contract.py
      - name: Locks match their inputs
        run: |
          ./scripts/lock_deps.sh
          git diff --exit-code -- requirements.txt requirements-cuda.txt requirements-dev.txt
      - name: Compile
        run: python -m compileall -q core routers scripts tests server.py
      - name: Lint
        run: python -m ruff check core routers scripts tests server.py
      - name: Test
        run: python -m pytest -q
      - name: Audit dependencies
        # PYSEC-2022-252 (deep-translator) não tem correção publicada: 1.11.4 já
        # é a última versão. A dependência sai quando a busca migrar para um
        # modelo multilíngue e a tradução deixar de ser necessária; até lá,
        # ignorar este id mantém o passo capaz de acusar qualquer coisa NOVA,
        # que é o valor dele. Uma CI cronicamente vermelha não é auditoria.
        run: python -m pip_audit --no-deps --disable-pip -r requirements.txt --ignore-vuln PYSEC-2022-252

  release-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot a clean private server
        run: ./scripts/test_release.sh
