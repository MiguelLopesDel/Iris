name: Release images

# Publishing a tag vX.Y.Z builds and pushes:
#   ghcr.io/miguellopesdel/iris:X.Y.Z  :X.Y  :latest               (CPU)
#   ghcr.io/miguellopesdel/iris:X.Y.Z-cuda  :X.Y-cuda  :latest-cuda (NVIDIA)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/miguellopesdel/iris

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          }
      - name: Build and boot a clean private server
        run: ./scripts/test_release.sh

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: cpu
            suffix: ""
          - profile: cuda
            suffix: "-cuda"
    steps:
      - name: Free disk space for the CUDA wheels
        if: matrix.profile == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            IRIS_PROFILE=${{ matrix.profile }}
            IRIS_COMMIT=${{ steps.commit.outputs.short }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
