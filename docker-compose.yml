# CPU server. For NVIDIA, also load docker-compose.gpu.yml (see .env.example).
# `docker compose pull` fetches the published image; `docker compose build`
# builds the same tag from this checkout instead.
services:
  iris:
    image: ${IRIS_IMAGE:-ghcr.io/miguellopesdel/iris}:${IRIS_VERSION:-latest}
    build:
      context: .
      args:
        IRIS_PROFILE: cpu
        IRIS_COMMIT: ${IRIS_COMMIT:-}
    user: "${IRIS_UID:-1000}:${IRIS_GID:-1000}"
    ports:
      - "127.0.0.1:${IRIS_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ${IRIS_BACKUP_DIR:-./backups}:/backup
      - huggingface_cache:/home/iris/.cache/huggingface
      - whisper_cache:/home/iris/.cache/whisper
      - insightface_models:/home/iris/.insightface
      - easyocr_models:/home/iris/.EasyOCR
    environment:
      PYTHONPATH: /app
      IRIS_MULTIUSER: ${IRIS_MULTIUSER:-auto}
      IRIS_SERVER_MODE: ${IRIS_SERVER_MODE:-private}
      IRIS_SESSION_HTTPS_ONLY: ${IRIS_SESSION_HTTPS_ONLY:-true}
      IRIS_ENGINE_CACHE_SIZE: ${IRIS_ENGINE_CACHE_SIZE:-1}
      IRIS_SEARCH_WORKERS: ${IRIS_SEARCH_WORKERS:-2}
      IRIS_LOAD_MODEL: ${IRIS_LOAD_MODEL:-1}
      IRIS_SYNC_AI_PROCESSING: ${IRIS_SYNC_AI_PROCESSING:-0}
      IRIS_MODEL: ${IRIS_MODEL:-sentence-transformers/clip-ViT-L-14}
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY:-}
      IRIS_LOG_LEVEL: ${IRIS_LOG_LEVEL:-INFO}
      IRIS_LOG_FORMAT: ${IRIS_LOG_FORMAT:-json}
      IRIS_LOG_ACCESS: ${IRIS_LOG_ACCESS:-1}
      IRIS_LOG_FILE: ${IRIS_LOG_FILE:-}
      IRIS_MAX_UPLOAD_BYTES: ${IRIS_MAX_UPLOAD_BYTES:-34359738368}
      IRIS_MAX_UPLOAD_FILES: ${IRIS_MAX_UPLOAD_FILES:-10000}
      IRIS_ACCOUNT_QUOTA_BYTES: ${IRIS_ACCOUNT_QUOTA_BYTES:-10995116277760}
      IRIS_MAX_IMAGE_PIXELS: ${IRIS_MAX_IMAGE_PIXELS:-500000000}
      IRIS_MAX_REQUEST_BYTES: ${IRIS_MAX_REQUEST_BYTES:-68719476736}
      IRIS_MAX_SEARCH_TOP_K: ${IRIS_MAX_SEARCH_TOP_K:-1000}
      IRIS_MAX_SEARCH_CANDIDATES: ${IRIS_MAX_SEARCH_CANDIDATES:-20000}
      IRIS_SPACE_STORAGE: ${IRIS_SPACE_STORAGE:-auto}
      IRIS_SPACE_QUOTA_BYTES: ${IRIS_SPACE_QUOTA_BYTES:-10995116277760}
      IRIS_SPACE_TRASH_DAYS: ${IRIS_SPACE_TRASH_DAYS:-30}
      IRIS_TRASH_DAYS: ${IRIS_TRASH_DAYS:-30}
      IRIS_BACKUP_DEST: /backup
      IRIS_BACKUP_HOST_DIR: ${IRIS_BACKUP_HOST_DIR:-}
      IRIS_BACKUP_SCHEDULE: ${IRIS_BACKUP_SCHEDULE:-daily}
      IRIS_BACKUP_TIME: ${IRIS_BACKUP_TIME:-03:00}
      IRIS_BACKUP_TIMEZONE: ${IRIS_BACKUP_TIMEZONE:-UTC}
      IRIS_BACKUP_KEEP_DAILY: ${IRIS_BACKUP_KEEP_DAILY:-7}
      IRIS_BACKUP_KEEP_WEEKLY: ${IRIS_BACKUP_KEEP_WEEKLY:-4}
      IRIS_BACKUP_KEEP_MONTHLY: ${IRIS_BACKUP_KEEP_MONTHLY:-6}
    restart: unless-stopped

volumes:
  huggingface_cache:
  whisper_cache:
  insightface_models:
  easyocr_models:
