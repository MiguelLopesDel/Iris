# Same bytes, different file sizes, one after another is not possible in one
# run, so this mixes them: compare per-size results across scenario runs.
name: sync-mixed-library
library_items: 6000
duration: 120s
actors:
  - kind: syncing
    devices: 1
    items: 600
    sizes: {"200KB-2MB": 80%, "2MB-20MB": 18%, "20MB-60MB": 2%}
    concurrency: 16
    target: {mb_per_s: 25}
