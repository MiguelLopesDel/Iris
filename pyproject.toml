[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-media"
version = "0.6.0"
description = "Self-hosted multi-account photo and video library."
requires-python = ">=3.13,<3.14"
# This repository is an application, not a portable Python library. Runtime
# dependencies are installed from requirements.txt (CPU) or
# requirements-cuda.txt (NVIDIA); development tools are in requirements-dev.txt.
# Keeping package metadata dependency-free prevents PyPI's generic torch wheel
# from overriding the explicitly selected CPU/CUDA runtime profile.

[project.scripts]
iris-app = "scripts.run_server:main"
iris-index = "core.indexer:main"
iris-benchmark = "scripts.benchmark:main"
iris-sample = "scripts.sample_media:main"
iris-eval-search = "scripts.evaluate_search:main"
iris-eval-captions = "scripts.evaluate_captions:main"
iris-gpu-probe = "scripts.gpu_probe:main"
iris-golden = "scripts.create_golden_set:main"
iris-eval-golden = "scripts.evaluate_golden_set:main"
iris-enrich-metadata = "scripts.enrich_metadata:main"
iris-find-duplicates = "scripts.find_duplicates:main"
iris-sync-index = "scripts.sync_index_after_trash:main"
iris-import-media = "scripts.import_media:main"
iris-migrate-library = "scripts.migrate_library:main"

[tool.setuptools]
packages = ["core", "scripts"]
py-modules = ["server"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "scripts/test_playground.py",
    "scripts/test_queries.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
