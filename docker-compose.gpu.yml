# NVIDIA override, layered on docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml   (in .env)
# Requires the NVIDIA driver >= 580 and the NVIDIA Container Toolkit on the host.
services:
  iris:
    image: ${IRIS_IMAGE:-ghcr.io/miguellopesdel/iris}:${IRIS_VERSION:-latest}-cuda
    build:
      args:
        IRIS_PROFILE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
